# deploy/docker-compose.yml
name: atheer-med-platform

services:
  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: atheer_backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql+asyncpg://atheer_user:atheer_password_secure@db:5432/atheer_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../backend:/app
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: atheer_db
    environment:
      POSTGRES_DB: atheer_db
      POSTGRES_USER: atheer_user
      POSTGRES_PASSWORD: atheer_password_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atheer_user -d atheer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: atheer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atheer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: